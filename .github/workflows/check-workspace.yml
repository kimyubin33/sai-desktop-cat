name: Google 작업 공간 검사
on:
  workflow_dispatch:
  pull_request:
    paths: ['core/**', 'src-tauri/**', 'ui-app/**', 'ui/**', 'xtask/**', 'services/team-ai/**', 'scripts/check-google-client*', 'scripts/build-preview*', 'package*.json', 'Cargo.toml', 'Cargo.lock', '.github/workflows/**']
  push:
    branches: [main]
    paths: ['core/**', 'src-tauri/**', 'ui-app/**', 'ui/**', 'xtask/**', 'services/team-ai/**', 'scripts/check-google-client*', 'scripts/build-preview*', 'package*.json', 'Cargo.toml', 'Cargo.lock', '.github/workflows/**']
permissions:
  contents: read
concurrency:
  group: workspace-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: 화면 빌드
        run: cargo run --locked -p xtask -- ui
      - name: 작업 공간·복원·권한·파일·일정 검사
        run: cargo test --locked --workspace -- --test-threads=4
      - name: AI 중계 운영 도구 설치
        working-directory: services/team-ai
        run: npm ci --no-fund --no-audit
      - name: AI 중계·SQLite 런타임·배포 설정 검사
        run: node --test services/team-ai/gateway.test.mjs services/team-ai/check-deployment.test.mjs services/team-ai/runtime.test.mjs scripts/check-google-client.test.mjs scripts/build-preview.test.mjs

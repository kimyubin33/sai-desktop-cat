</div></section>

<section id="profileSection" class="settings-card hidden"><div class="card-heading"><div><h2>내 정보</h2></div><button id="profileSync" type="button" data-icon="refresh" aria-label="내 정보 동기화" title="내 정보 동기화" class="text-button icon-button"></button></div><form id="profileForm"><label class="field-label">내 이름<input id="profileName" type="text" maxlength="60" autocomplete="nickname" disabled></label><label class="field-label">캐릭터 이름<input id="profileCat" type="text" maxlength="30" required disabled></label><label class="setting-row"><span><strong>말 거는 빈도</strong></span><select id="profileFrequency" aria-label="동기화할 말 거는 빈도" disabled><option value="low">가끔</option><option value="normal">보통</option><option value="high">자주</option></select></label><div class="save-row"><span id="profileMessage" role="status"></span><button class="subtle" type="submit" disabled>저장</button></div></form></section>
<form id="settingsForm"><section class="settings-card"><h2>기기</h2><label id="localFrequency" class="setting-row"><span><strong>말 거는 빈도</strong></span><select name="frequency" aria-label="말 거는 빈도"><option value="low">가끔</option><option value="normal">보통</option><option value="high">자주</option></select></label><label class="setting-row"><span><strong>개인 대화 보관</strong></span><select name="retentionDays" aria-label="개인 대화 보관 기간"><option value="0">계속 보관</option><option value="7">7일</option><option value="30">30일</option><option value="90">90일</option></select></label></section>

<section class="update-row"><div><strong>사이 <span id="appVersion"></span></strong><p id="updateStatus" role="status">버전 확인 중</p></div><div class="inline"><button id="updateCheck" class="subtle" type="button">업데이트 확인</button><button id="updateInstall" class="primary hidden" type="button">적용하기</button></div></section>
</div></section>

<details id="calendarDeletePanel" class="calendar-delete hidden"><summary>일정 삭제</summary><label class="analysis-choice"><input id="calendarDeleteAck" type="checkbox" disabled><span>이 일정 삭제 확인</span></label><button id="calendarDelete" class="text-button" type="button" disabled data-icon="trash" aria-label="내 일정 삭제" title="내 일정 삭제">삭제</button></details>

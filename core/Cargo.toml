[package]
name = "sai-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "사이 — 고양이 협업 도우미의 핵심 로직 (창·화면과 무관)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
once_cell = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots", "rustls-tls-native-roots", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs"] }
futures-util = "0.3"
sha2 = "0.10"
base64 = "0.22"
url = "2"
urlencoding = "2"
thiserror = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
mdns-sd = "0.20.2"
if-addrs = "0.15"
ring = "0.17"
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
hpke = { version = "0.13", default-features = false, features = ["alloc", "x25519"] }
rand09 = { package = "rand", version = "0.9" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_System_Memory", "Win32_System_SystemInformation"] }
windows = { version = "0.62.2", features = ["Win32_Networking_NetworkListManager", "Win32_System_Com"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }

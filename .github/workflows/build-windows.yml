# 전환 중에는 검증 설치 파일만 만든다. 정식 배포는 실계정·설치 검증 완료 후 별도로 진행한다.
name: Windows 검증 설치 파일
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: preview-${{ matrix.arch }}
      - run: npm ci
      - name: 빌드에 Google 데스크톱 연결 정보 포함
        env:
          GOOGLE_CLIENT_JSON: ${{ secrets.GOOGLE_CLIENT_JSON || vars.GOOGLE_CLIENT_JSON }}
        run: node scripts/check-google-client.mjs --write-env
      - name: 화면 빌드
        run: cargo run --locked -p xtask -- ui
      - name: 작업 공간 검사
        run: cargo test --locked --workspace -- --test-threads=4
      - name: AI 중계와 빌드 설정 모의 검사
        run: node --test services/team-ai/gateway.test.mjs scripts/check-google-client.test.mjs scripts/build-preview.test.mjs
      - name: 검증 설치 파일 만들기
        env:
          SAI_TEAM_AI_ENDPOINT: ${{ vars.SAI_TEAM_AI_ENDPOINT }}
        run: npm run build:preview -- --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: sai-preview-windows-${{ matrix.arch }}
          path: target/preview-dist/win-${{ matrix.arch }}/*
          if-no-files-found: error

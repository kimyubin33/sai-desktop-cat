# 팀 서버 규칙(firestore.rules) 점검
# 저장소의 규칙을 로컬 에뮬레이터에 그대로 올리고, 앱이 쓰는 코드로 팀 기능·권한을 모두 확인한다.
# (실제 서버에 게시하기 전에 규칙이 맞는지 여기서 먼저 본다)
name: 팀 서버 규칙 점검

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['firestore.rules', 'firebase.json', 'core/**', '.github/workflows/rules.yml']

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: rules
      - name: 점검 프로그램 만들기
        run: cargo test -p sai-core --test firebase_real --no-run
      - name: 에뮬레이터에서 규칙 점검
        run: npx -y firebase-tools@14 emulators:exec --only auth,firestore --project demo-sai "SAI_FIREBASE_EMULATOR=1 cargo test -p sai-core --test firebase_real -- --ignored --nocapture"
